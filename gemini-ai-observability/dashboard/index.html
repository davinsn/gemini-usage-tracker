<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gemini Observability Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="dashboard">

    <header>
        <div>
            <h1>Gemini Observability</h1>
            <p>AI usage monitoring dashboard</p>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            API Connected
        </div>
    </header>


    <!-- KPI CARDS -->

    <section class="metrics">

        <div class="metric-card">
            <span class="metric-label">Interactions</span>
            <strong id="interactions">-</strong>
        </div>

        <div class="metric-card">
            <span class="metric-label">Sessions</span>
            <strong id="sessions">-</strong>
        </div>

        <div class="metric-card">
            <span class="metric-label">Active Employees</span>
            <strong id="employees">-</strong>
        </div>

        <div class="metric-card">
            <span class="metric-label">Average Latency</span>
            <strong id="latency">-</strong>
        </div>

    </section>


    <!-- CHARTS -->

    <section class="charts">

        <div class="chart-card">

            <div class="chart-header">
                <h2>Interactions by Employee</h2>
            </div>

            <canvas id="interactionChart"></canvas>

        </div>


        <div class="chart-card">

            <div class="chart-header">
                <h2>Sessions by Employee</h2>
            </div>

            <canvas id="sessionChart"></canvas>

        </div>


        <div class="chart-card wide">

            <div class="chart-header">
                <h2>Average Latency by Employee</h2>
            </div>

            <canvas id="latencyChart"></canvas>

        </div>

    </section>


    <!-- EMPLOYEE TABLE -->

    <section class="table-card">

        <div class="chart-header">
            <h2>Employee Usage</h2>
        </div>

        <table>

            <thead>
                <tr>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Interactions</th>
                    <th>Sessions</th>
                    <th>Avg Latency</th>
                </tr>
            </thead>

            <tbody id="employeeTable">
            </tbody>

        </table>

    </section>

</div>

<script src="dashboard.js"></script>

</body>
</html>
